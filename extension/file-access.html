<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Screenshot — Enable File Access</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f172a; color: #f1f5f9;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }
  .card {
    background: #1e293b; border: 1px solid #334155;
    border-radius: 16px; padding: 40px 48px;
    max-width: 480px; text-align: center;
  }
  .icon { font-size: 40px; margin-bottom: 20px; }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 12px; }
  p { font-size: 14px; color: #94a3b8; line-height: 1.7; margin-bottom: 20px; }
  ol { text-align: left; font-size: 14px; color: #cbd5e1; line-height: 2; padding-left: 20px; }
  ol li span { color: #60a5fa; font-family: monospace; }
  .btn {
    display: inline-block; margin-top: 28px;
    padding: 10px 24px; background: #2563eb;
    border-radius: 8px; color: #fff;
    font-size: 14px; font-weight: 600;
    text-decoration: none; cursor: pointer; border: none;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📂</div>
    <h1>Allow access to local files</h1>
    <p>To capture screenshots of local files (<code style="color:#60a5fa">file://</code> URLs), Chrome needs one extra permission.</p>
    <ol>
      <li>Open <span>chrome://extensions</span></li>
      <li>Find <strong>Screenshot</strong> and click <strong>Details</strong></li>
      <li>Turn on <strong>"Allow access to file URLs"</strong></li>
      <li>Come back and try again</li>
    </ol>
    <button class="btn" onclick="window.close()">Got it</button>
  </div>
</body>
</html>
